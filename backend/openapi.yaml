openapi: 3.0.3
info:
  title: TruckAccounting API
  version: "0.1.0"
  description: |
    Backend API for TruckAccounting (Phase 3). Errors always follow the shape:
    `{ "code": string, "message": string, "details": object }`.
servers:
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: "اطلاعات وارد شده صحیح نیست" }
        details: { type: object }
    AuthResponse:
      type: object
      description: >
        `status` is always present. When it's "authenticated", every other field below is also
        present. When it's "pending_approval" (this phone's trusted device is a different one —
        see the single-trusted-device rule on /auth/login), only `requestId` is present and no
        tokens are issued; poll GET /auth/device-requests/{id} until it resolves.
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, pending_approval] }
        requestId: { type: string, format: uuid, description: "Present only when status=pending_approval." }
        accessToken: { type: string }
        refreshToken: { type: string }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, driver] }
        fullName: { type: string }
        phoneNumber: { type: string }
        subscriptionStatus: { type: string, enum: [trial, active, expired] }
        trialDaysLeft: { type: integer, nullable: true }
    Truck:
      type: object
      properties:
        id: { type: string, format: uuid }
        plate: { type: string, example: "22 الف 262 ایران 22" }
        brand: { type: string }
        modelYear: { type: string }

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200": { description: OK }

  /auth/register:
    post:
      summary: Register a new Owner or Driver account
      description: The registering device becomes this account's trusted device immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, password, fullName, role, deviceId]
              properties:
                phoneNumber: { type: string, example: "09121234567" }
                password: { type: string, minLength: 6 }
                fullName: { type: string }
                role: { type: string, enum: [owner, driver] }
                companyName: { type: string }
                deviceId: { type: string, description: "A stable id the client generates once and reuses across sessions on the same device." }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "409": { description: Phone number already registered, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/login:
    post:
      summary: Log in with phone number + password
      description: >
        Single-trusted-device rule: if `deviceId` doesn't match this account's currently trusted
        device, no tokens are issued (see the 202 response) — the currently trusted device must
        approve via POST /auth/device-requests/{id}/approve first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, password, deviceId]
              properties:
                phoneNumber: { type: string }
                password: { type: string }
                deviceId: { type: string }
                deviceLabel: { type: string, description: "Optional human-readable label (e.g. browser/OS) shown to the trusted device when it reviews the request." }
      responses:
        "200":
          description: Logged in (status=authenticated)
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } }
        "202":
          description: Pending approval from this account's trusted device (status=pending_approval)
          content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } }
        "400": { description: Invalid credentials (deliberately identical for wrong-password and unknown-phone) }

  /auth/device-requests/{id}:
    get:
      summary: Poll a pending login-approval request (no auth — the id itself is the gate)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "{status: pending|denied|expired} or, once approved, {status: authenticated, ...AuthResponse} — tokens are minted on this poll and the request is then one-time-consumed."
        "404": { description: No such request }

  /auth/device-requests:
    get:
      summary: List this account's own pending device-approval requests (requires the trusted device's access token)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{requests: [{id, deviceLabel, createdAt}]}" }

  /auth/device-requests/{id}/approve:
    post:
      summary: Approve a pending request — trust transfers to that device
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Approved }
        "404": { description: No such request, or it doesn't belong to the authenticated account }
        "409": { description: Request is no longer pending }

  /auth/device-requests/{id}/deny:
    post:
      summary: Deny a pending request
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Denied }
        "404": { description: No such request, or it doesn't belong to the authenticated account }
        "409": { description: Request is no longer pending }

  /auth/refresh:
    post:
      summary: Exchange a valid refresh token for a new access+refresh token pair (rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: New token pair issued }
        "401": { description: Refresh token invalid, expired, or already rotated/revoked }

  /auth/logout:
    post:
      summary: Revoke all refresh tokens for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: Logged out }

  /auth/me:
    get:
      summary: Current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
        "401": { description: Missing/invalid/expired access token }

  /owners/me:
    get:
      summary: Owner's own profile
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK }, "403": { description: Not an owner } }
    put:
      summary: Update owner's own profile
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Updated } }

  /drivers/me:
    get:
      summary: Driver's own profile, including their currently connected truck (if any)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK }, "403": { description: Not a driver } }
    put:
      summary: Update driver's own profile
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Updated } }

  /trucks:
    get:
      summary: List the authenticated owner's trucks
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { trucks: { type: array, items: { $ref: "#/components/schemas/Truck" } } }
    post:
      summary: Create a truck
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate, brand, modelYear]
              properties:
                plate: { type: string, description: "Format: NN <letter> NNN ایران PP" }
                brand: { type: string }
                modelYear: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Truck" } } } }
        "409": { description: Plate already registered }
        "422": { description: Invalid plate format }

  /trucks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get a truck by id (only if owned by the caller)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "404": { description: "Not found — returned both when the truck doesn't exist AND when it belongs to a different owner (Phase 3 §20)" }
    put:
      summary: Update a truck (only if owned by the caller)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Updated }, "404": { description: Not found / not yours } }
    delete:
      summary: Soft-delete a truck (only if owned by the caller)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Deleted }, "404": { description: Not found / not yours } }

  /invitations:
    post:
      summary: Owner invites a driver by phone number, optionally pre-assigning a truck
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverPhone]
              properties:
                driverPhone: { type: string }
                truckId: { type: string, format: uuid }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  inviteCode: { type: string, example: "DRV-849251" }
                  expiresAt: { type: string, format: date-time }

  /owner/invitations:
    get:
      summary: List invitations the owner has sent
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /driver/invitations:
    get:
      summary: List pending invitations addressed to the authenticated driver's phone number
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /driver/invitations/{id}/accept:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Accept an invitation — creates the driver_trucks relationship if a truck was attached
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Accepted }
        "403": { description: "Invitation is not addressed to the caller's phone number" }
        "404": { description: Not found }
        "409": { description: Already used or expired }

  /owner/drivers/{driverTruckId}:
    parameters: [{ name: driverTruckId, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Disconnect a driver from their truck (soft — end_date is set, history preserved)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Disconnected } }

  /drivers:
    get:
      summary: List drivers currently connected to any of the owner's trucks
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /owner/dashboard:
    get:
      summary: Owner dashboard summary (financial fields are running totals across all history — see dashboard.routes.ts)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /driver/dashboard:
    get:
      summary: Driver dashboard summary (financial fields are running totals across all history — see dashboard.routes.ts)
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /drivers/{driverId}/pay:
    parameters: [{ name: driverId, in: path, required: true, schema: { type: string } }]
    put:
      summary: Owner sets how a driver's pay is calculated (percent of each trip, or a flat monthly salary)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payType, payValue]
              properties:
                payType: { type: string, enum: [percent, salary] }
                payValue: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated }
        "404": { description: "Driver not actively connected to one of the owner's trucks" }
        "422": { description: Validation error }

  /trips:
    post:
      summary: Driver logs a service against the truck they are currently assigned to
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination, income, tripDate]
              properties:
                origin: { type: string }
                destination: { type: string }
                cargoType: { type: string, nullable: true }
                cargoWeight: { type: string, nullable: true }
                income: { type: integer, minimum: 0 }
                tripDate: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201": { description: Created }
        "403": { description: "Caller is not a driver, or has no active truck" }

  /driver/trips:
    get:
      summary: List the authenticated driver's own trips
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /owner/trips:
    get:
      summary: List every trip logged on any of the owner's trucks, by any driver
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /trips/{id}/settlement:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      summary: Owner records the barnameh commission and who the trip's money actually went to
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commission: { type: integer, minimum: 0 }
                settled: { type: boolean }
                paidTo: { type: string, enum: [driver, owner], nullable: true }
      responses:
        "200": { description: Updated }
        "404": { description: "Trip not on a truck this owner owns" }

  /expenses:
    post:
      summary: Driver logs an expense against the truck they are currently assigned to
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, amount, expenseDate]
              properties:
                category: { type: string }
                amount: { type: integer, minimum: 0 }
                expenseDate: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201": { description: Created }
        "403": { description: "Caller is not a driver, or has no active truck" }

  /driver/expenses:
    get:
      summary: List the authenticated driver's own expenses
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /owner/expenses:
    get:
      summary: List every expense logged on any of the owner's trucks
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /owner/settlement/summary:
    get:
      summary: Income/expense/entitlement/remaining-owed summary for one of the owner's drivers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: driverId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { description: "driverId not actively connected to one of the owner's trucks" }

  /driver/settlement/summary:
    get:
      summary: The authenticated driver's own income/expense/entitlement/remaining-owed summary
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }

  /owner/settlement/payments:
    post:
      summary: Owner records a manual payment made to a driver, reducing what is still owed
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, amount]
              properties:
                driverId: { type: string }
                amount: { type: integer, minimum: 1 }
                paymentDate: { type: string }
                method: { type: string, nullable: true }
      responses:
        "201": { description: "Recorded — returns the updated settlement summary" }
        "404": { description: "driverId not actively connected to one of the owner's trucks" }
        "422": { description: "amount exceeds the remaining balance owed" }
